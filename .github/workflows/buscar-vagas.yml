name: Buscar vagas de T.I. (a cada 1h)

on:
  schedule:
    - cron: "7 * * * *"   # minuto 7 de toda hora (evita o pico do minuto 0 no GitHub)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: buscar-vagas
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m unittest discover -s tests -t . -v

      - name: Coletar vagas
        run: python -m scraper

      - name: Salvar dados no repositório
        run: |
          git config user.name "radar-vagas[bot]"
          git config user.email "radar-vagas@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "dados: coleta de vagas $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
